schema: spec-driven

context: |
  Atenti is an Expo/React Native mobile app for fraud reporting and alerts.
  - Stack: Expo 57, React 19, React Native 0.86, TypeScript, Firebase
  - Navigation: @react-navigation/native-stack
  - State: React Context (ReportFlowContext, AuthContext)
  - Services: Firebase (auth, firestore, storage), OCR, credibility scoring
  - Offline-first with local draft storage (AsyncStorage)
  - Write all artifacts in Spanish
  - Follow existing code patterns and conventions

rules:
  proposal:
    - Keep proposals under 500 words
    - Always state what is out of scope
    - Reference existing screens/components by name (e.g., P1_HomeScreen, P4_CreateReportScreen)
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task should map to a specific file or component
    - Include testing verification steps

operations:
  apply:
    guidance:
      - Follow existing component structure in src/components/ and src/screens/
      - Use existing services in src/services/ (firebase.ts, credibility.ts, ocrService.ts, etc.)
      - Maintain TypeScript strict mode
      - Run `npm run verify` after implementation
  archive:
    guidance:
      - Summarize the archive outcome before finishing
      - Update relevant specs if behavior changed
